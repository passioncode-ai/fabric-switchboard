[workspace]
members = ["crates/switchboard-core", "crates/switchboard-proxy", "src-tauri", "crates/switchboard-runtime", "crates/switchboard-cli"]
resolver = "2"
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-PassionCode-Commercial"
repository = "https://github.com/passioncode-ai/fabric-switchboard"
homepage = "https://passioncode.ai/switchboard/"
publish = false
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
