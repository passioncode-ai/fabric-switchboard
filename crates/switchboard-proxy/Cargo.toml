[package]
name = "switchboard-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
[dependencies]
switchboard-core = { path = "../switchboard-core" }
axum = "0.8"
tokio.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
[features]
# Lets another crate's tests point the usage probe at a local synthetic upstream. Enabled only
# through dev-dependencies, so no shipped binary can send a credential anywhere but the fixed
# provider origins.
synthetic-origins = []
[dev-dependencies]
tempfile = "3"
