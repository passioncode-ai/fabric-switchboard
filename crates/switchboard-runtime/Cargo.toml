[package]
name = "switchboard-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
[dependencies]
switchboard-core = { path = "../switchboard-core" }
switchboard-proxy = { path = "../switchboard-proxy" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
subtle = "2"
dirs = "6"
base64 = "0.22"
toml = "0.9"
hmac = "0.12"
sha2 = "0.10"
unicode-normalization = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
