[package]
name = "fabric-sessions-core"
# Its own version (SB-397 D-1): Fabric Sessions is a product of its own, released apart from
# Switchboard once W2 ships its binary.
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
# D-2: no switchboard-* crate, ever (`cargo tree -p fabric-sessions-core`).
[dependencies]
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
dirs = "6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
