name: Build Windows artifacts
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source commit to build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-artifact-${{ inputs.expected_sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify source commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Source commit mismatch' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - run: npm ci
      - name: Native storage and runtime acceptance fixtures
        run: |
          cargo test -p switchboard-core -p switchboard-runtime -p switchboard-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build CLI and NSIS desktop installer
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p switchboard-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:RUSTFLAGS
          npm exec tauri build -- --bundles nsis --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable CLI and record hashes
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/switchboard.exe artifacts/switchboard.exe
          Copy-Item target/release/bundle/nsis/*.exe artifacts/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md artifacts/
          & artifacts/switchboard.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem artifacts -Filter *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
          @{'commit'=(git rev-parse HEAD);'runner'=$env:RUNNER_OS;'arch'=$env:RUNNER_ARCH;'rustc'=(rustc --version);'node'=(node --version);'native_fixtures'='PASS';'windows_authenticode'='NOT_SIGNED';'provider_live_acceptance'='NOT_RUN'} | ConvertTo-Json | Set-Content artifacts/build-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-switchboard-windows-x64-${{ inputs.expected_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
