name: Nightly checks
on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/nightly_clock.py
          sparse-checkout-cone-mode: false
      # GitHub starts scheduled runs late (issue #5), so the start hour proves nothing: the
      # planned slot of the line that fired decides, one full run per Warsaw date.
      - id: clock
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 scripts/nightly_clock.py "$SCHEDULE" > clock.out
          cat clock.out >> "$GITHUB_OUTPUT"
          if grep -qx 'run=false' clock.out; then
            echo "::notice title=Nightly checks skipped::this cron line is tonight's daylight-saving duplicate; the other line runs the full checks"
          fi
  checks:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust stable with lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: npm ci
      - run: ./scripts/check.sh
      - run: npm run app:build
  # The release job's Windows path without the release environment and without signing:
  # its native fixtures, its build and its clean-tree rule. A Windows-only defect then
  # surfaces the night it lands, not at the next rehearsal.
  windows:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - run: npm ci
      - name: Native storage and runtime fixtures
        run: |
          cargo test -p switchboard-core -p switchboard-runtime -p switchboard-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The fixtures leave the source tree as checked out
        run: |
          $changed = git status --porcelain --untracked-files=all
          if ($changed) { $changed | ForEach-Object { Write-Host $_ }; Write-Host "::error::the fixtures changed the source tree"; exit 1 }
      - name: Build the CLI, the desktop executable and the installer, unsigned
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p switchboard-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:RUSTFLAGS
          npm exec tauri build -- --no-bundle --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm exec tauri bundle -- --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The release job refuses a receipt for a tree its build changed (package_windows.py).
      - name: The build leaves the source tree as checked out
        run: |
          $changed = git status --porcelain --untracked-files=all
          if ($changed) {
            $changed | ForEach-Object { Write-Host $_ }
            # What changed, for a public source tree: line endings, then content.
            git ls-files --eol -m
            Write-Host "--- ignoring carriage returns:"; git diff --ignore-cr-at-eol --stat
            Write-Host "--- the diff:"; git diff --stat; git diff -- src-tauri/Cargo.toml
            Write-Host "::error::the build changed the source tree"; exit 1
          }
